version: '3.8'

services:
  proxy:
    image: craftslab/proxy:latest
    container_name: proxy
    ports:
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      - GO_ENV=production
    networks:
      - proxy-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - proxy
    networks:
      - proxy-network
    restart: unless-stopped

networks:
  proxy-network:
    driver: bridge

volumes:
  proxy-data:
    driver: local
